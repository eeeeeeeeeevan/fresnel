<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>shell</title>
<style>
html, body {
	height: 100%;
	margin: 0;
	background: #000;
	color: #eee;
	font: 13px/1.45 monospace;
}
body {
	display: flex;
	flex-direction: column;
}
#out {
	flex: 1;
	overflow-y: auto;
	margin: 0;
	padding: 10px 10px 0;
	white-space: pre-wrap;
	word-break: break-all;
}
#line {
	display: flex;
	align-items: center;
	padding: 0 10px 10px;
	flex: none;
}
#prompt {
	color: rgb(63, 220, 63);
	white-space: pre;
	flex: none;
}
#i {
	flex: 1;
	min-width: 0;
	background: transparent;
	color: #eee;
	border: 0;
	outline: 0;
	padding: 0;
	font: inherit;
	caret-color: #eee;
}
#i:disabled {
	opacity: .55;
}
</style>
</head>
<body>
<pre id="out"></pre>
<div id="line">
	<span id="prompt">(fresnel)&gt; </span>
	<input id="i" autofocus autocomplete="off" autocapitalize="off" spellcheck="false">
</div>
<script>
const out = document.getElementById("out");
const input = document.getElementById("i");
const prompt = document.getElementById("prompt");
let busy = false;
let closed = false;

const ws = new WebSocket((location.protocol === "https:" ? "wss://" : "ws://") + location.host + "/sws?t=" + new URLSearchParams(location.search).get("t"));

function scroll() {
	out.scrollTop = out.scrollHeight;
	window.scrollTo(0, document.body.scrollHeight);
}

function append(text) {
	out.textContent += text;
	scroll();
}

ws.onmessage = e => {
	if (e.data === "\x00") {
		busy = false;
		input.disabled = false;
		prompt.textContent = "(fresnel)> ";
		input.focus();
		return;
	}
	append(e.data + "\n");
};

ws.onclose = () => {
	closed = true;
	busy = true;
	input.disabled = true;
	prompt.textContent = "(closed)> ";
	append("[disconnected]\n");
};

input.addEventListener("keydown", e => {
	if (e.key !== "Enter" || busy || closed) return;
	const line = input.value;
	if (!line.length) return;

	busy = true;
	input.disabled = true;
	prompt.textContent = "(running)> ";

	append("(fresnel)> " + line + "\n");
	ws.send(line);
	input.value = "";
});
</script>
</body>
</html>
